<app-page-header title="Tableau de bord" [subtitle]="dashboardSubtitle"></app-page-header><section class="stats"><app-stat-card label="Demandes" [value]="demandes.length + ''"></app-stat-card><app-stat-card label="Echantillons" [value]="echantillons.length + ''" tone="warning"></app-stat-card><app-stat-card label="Resultats non conformes" [value]="resultats.filter(r => !r.conforme).length + ''" tone="danger"></app-stat-card><app-stat-card label="Rapports" [value]="registry.rapports.snapshot().length + ''" tone="success"></app-stat-card></section><section class="panel"><h3>Priorites pour {{ auth.currentRole() }}</h3><ul><li *ngFor="let action of actions">{{ action }}</li></ul></section>
