<div class="auth-shell"><section class="hero"><span class="eyebrow">Creer un compte</span><h1>Acces projet de stage</h1><p>Cette page reste simple mais presentable pour une soutenance: champs clairs, roles exacts backend et redirection vers le dashboard adapte.</p></section><section class="card"><h2>Creer un compte</h2><form (ngSubmit)="register()"><label>Nom<input type="text" name="nom" [(ngModel)]="nom" required></label><label>Email<input type="email" name="email" [(ngModel)]="email" required></label><label>Mot de passe<input type="password" name="motDePasse" [(ngModel)]="motDePasse" required></label><label>Role<select name="role" [(ngModel)]="role"><option *ngFor="let item of roles" [ngValue]="item">{{ item }}</option></select></label><button class="btn btn-primary" type="submit">Creer le compte</button></form><p class="error" *ngIf="error">{{ error }}</p><a routerLink="/auth/login">Retour a la connexion</a></section></div>
