<app-page-header title="Saisie des resultats" subtitle="Comparaison automatique a la Fourchette selon Article + TypeAnalyse."></app-page-header><section class="panel form-grid"><label>Echantillon<select [(ngModel)]="model.echantillonId" name="echantillonId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of registry.echantillons.snapshot()" [ngValue]="item.id">{{ item.code }}</option></select></label><label>TypeAnalyse<select [(ngModel)]="model.typeAnalyseId" name="typeAnalyseId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of registry.typesAnalyse.snapshot()" [ngValue]="item.id">{{ item.libelle }}</option></select></label><label>Valeur<input type="number" [(ngModel)]="model.valeur" name="valeur"></label><div class="range" *ngIf="currentRange">Fourchette attendue : {{ currentRange.valeurMin }} → {{ currentRange.valeurMax }}</div><div class="range" *ngIf="conforme !== null">Statut calcule : <strong [class.ok]="conforme" [class.bad]="conforme === false">{{ conforme ? 'Conforme' : 'Non conforme' }}</strong></div><button class="btn btn-primary" type="button" (click)="save()">Enregistrer le resultat</button><p>{{ message }}</p></section>
