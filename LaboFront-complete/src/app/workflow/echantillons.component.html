<app-page-header title="Echantillons a traiter" subtitle="Vue Technician sur les echantillons en attente ou en cours."></app-page-header><section class="panel"><table><thead><tr><th>Code</th><th>DemandeTest</th><th>Date reception</th><th>Statut</th><th></th></tr></thead><tbody><tr *ngFor="let item of items"><td>{{ item.code }}</td><td>{{ demandeNumero(item.demandeTestId) }}</td><td>{{ item.dateReception }}</td><td><span class="pill">{{ item.statut }}</span></td><td><a [routerLink]="['/app/workflow/saisie-resultats', item.id]" class="btn btn-primary">Saisir resultat</a></td></tr></tbody></table></section>
