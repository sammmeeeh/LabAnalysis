<app-page-header title="Resultats hors fourchette" subtitle="Espace NutritionManager pour interpretation et commentaire."></app-page-header><section class="list"><article class="panel" *ngFor="let item of items"><strong>Resultat #{{ item.id }}</strong><p>Valeur: {{ item.valeur }}</p><textarea [(ngModel)]="notes[item.id]" [placeholder]="item.commentaireNutrition || 'Commentaire / interpretation'"></textarea><button class="btn btn-primary" type="button" (click)="save(item.id)">Enregistrer l interpretation</button></article></section>
