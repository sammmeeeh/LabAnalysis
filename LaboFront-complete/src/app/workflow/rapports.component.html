<app-page-header title="Rapports generes" subtitle="Liste des Rapport avec bouton de telechargement factice."></app-page-header><section class="panel"><table><thead><tr><th>Reference</th><th>DemandeTest</th><th>Date</th><th></th></tr></thead><tbody><tr *ngFor="let item of items"><td>{{ item.reference }}</td><td>{{ item.demandeTestId }}</td><td>{{ item.dateGeneration }}</td><td><button class="btn btn-secondary" type="button" (click)="download(item.reference)">Telecharger</button></td></tr></tbody></table></section>
