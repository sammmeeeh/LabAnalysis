<app-page-header title="Decisions qualite en attente" subtitle="DecisionQualite sur lots non conformes: Deblocage ou Recyclage."></app-page-header><section class="grid"><article class="panel"><h3>Demandes en attente</h3><ul><li *ngFor="let item of pending">{{ item.numero }} · {{ item.statut }}</li></ul></article><article class="panel"><h3>Formulaire decision qualite</h3><label>DemandeTest<select [(ngModel)]="model.demandeTestId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of pending" [ngValue]="item.id">{{ item.numero }}</option></select></label><label>Decision<select [(ngModel)]="model.decision"><option>Deblocage</option><option>Recyclage</option></select></label><label>Motif<textarea [(ngModel)]="model.motif"></textarea></label><button class="btn btn-primary" type="button" (click)="save()">Enregistrer</button></article></section>
