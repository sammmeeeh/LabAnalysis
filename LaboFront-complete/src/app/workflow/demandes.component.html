<app-page-header [title]="mode === 'validation' ? 'Validation des demandes' : 'Mes demandes de test'" [subtitle]="mode === 'validation' ? 'Vue administrateur pour valider ou refuser les demandes Soumise.' : 'Liste filtree par statut des DemandeTest du Client connecte.'"></app-page-header><section class="panel"><div class="toolbar"><label>Filtre statut<select [(ngModel)]="statut"><option>Tous</option><option>Brouillon</option><option>Soumise</option><option>Validee</option><option>Refusee</option><option>Cloturee</option></select></label><a *ngIf="mode !== 'validation'" routerLink="/app/workflow/nouvelle-demande" class="btn btn-primary">Nouvelle demande</a></div><table><thead><tr><th>Numero</th><th>Client</th><th>Article</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let item of demandes"><td>{{ item.numero }}</td><td>{{ clientName(item.clientId) }}</td><td>{{ articleName(item.articleId) }}</td><td>{{ item.dateDemande }}</td><td><span class="pill">{{ item.statut }}</span></td><td class="actions"><button class="btn-link" (click)="open(item.id)">Detail</button><ng-container *ngIf="mode === 'validation' && item.statut === 'Soumise'"><button class="btn-link" (click)="updateStatus(item.id, 'Validee')">Valider</button><button class="btn-link danger" (click)="updateStatus(item.id, 'Refusee')">Refuser</button></ng-container></td></tr></tbody></table></section>
