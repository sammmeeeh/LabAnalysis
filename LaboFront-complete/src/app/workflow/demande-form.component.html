<app-page-header title="Nouvelle demande" subtitle="Creation de DemandeTest avec Article, Usine et infos echantillon."></app-page-header><section class="panel form-grid"><label>Article<select [(ngModel)]="model.articleId" name="articleId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of registry.articles.snapshot()" [ngValue]="item.id">{{ item.designation }}</option></select></label><label>Usine<select [(ngModel)]="model.usineId" name="usineId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of usines" [ngValue]="item.id">{{ item.nom }}</option></select></label><label>NatureEchantillon<select [(ngModel)]="model.natureEchantillonId" name="natureEchantillonId"><option [ngValue]="undefined">Selectionner</option><option *ngFor="let item of registry.naturesEchantillon.snapshot()" [ngValue]="item.id">{{ item.libelle }}</option></select></label><label>Date demande<input type="date" [(ngModel)]="model.dateDemande" name="dateDemande"></label><label>Infos echantillon<textarea [(ngModel)]="model.echantillonInfo" name="echantillonInfo"></textarea></label><label>Commentaire<textarea [(ngModel)]="model.commentaire" name="commentaire"></textarea></label><div class="actions"><button class="btn btn-secondary" type="button" (click)="save('Brouillon')">Enregistrer brouillon</button><button class="btn btn-primary" type="button" (click)="save('Soumise')">Soumettre</button></div></section>
